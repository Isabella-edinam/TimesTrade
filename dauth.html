<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIMESTRADE — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--accent:#00e57a;--accent2:#38b6ff;--bg:#05080c;--panel:#0c1018;--border:#1c2535;--text:#cdd6e3;--dim:#4a5e72;--glow:0 0 30px rgba(0,229,122,0.3);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(0,229,122,0.018) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,122,0.018) 1px,transparent 1px);background-size:44px 44px;}
.bg-glow{position:fixed;top:20%;left:50%;transform:translateX(-50%);width:600px;height:500px;background:radial-gradient(ellipse,rgba(0,229,122,0.06) 0%,transparent 65%);pointer-events:none;z-index:0;}
nav{position:relative;z-index:10;display:flex;align-items:center;padding:0 40px;height:64px;background:rgba(5,8,12,0.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.05);}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:4px;color:var(--accent);text-shadow:var(--glow);text-decoration:none;}
.nav-logo span{color:var(--accent2);}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem;position:relative;z-index:10;}
.box{width:100%;max-width:420px;background:rgba(12,16,24,0.97);border:1px solid var(--border);border-radius:16px;padding:40px 36px;box-shadow:0 40px 80px rgba(0,0,0,0.5);animation:fadeUp .5s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.box-logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:4px;color:var(--accent);text-shadow:var(--glow);margin-bottom:5px;}
.box-logo span{color:var(--accent2);}
.box-sub{font-size:13px;color:var(--dim);margin-bottom:26px;line-height:1.6;}
.tabs{display:flex;border:1px solid var(--border);border-radius:10px;margin-bottom:24px;overflow:hidden;}
.tab{flex:1;padding:10px;text-align:center;font-size:11px;font-family:'Space Mono',monospace;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;transition:all .2s;color:var(--dim);background:none;border:none;}
.tab.active{background:rgba(0,229,122,0.1);color:var(--accent);}
.form-group{margin-bottom:15px;}
label{display:block;font-size:10px;font-family:'Space Mono',monospace;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:6px;}
input[type=email],input[type=password]{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:9px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;}
input:focus{border-color:rgba(0,229,122,0.4);}
input::placeholder{color:var(--dim);}
.btn-submit{width:100%;background:var(--accent);color:#000;border:none;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.5px;font-family:'Space Mono',monospace;padding:13px;border-radius:10px;transition:all .2s;margin-top:4px;}
.btn-submit:hover{background:#00ff88;box-shadow:var(--glow);}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--dim);font-size:11px;font-family:'Space Mono',monospace;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.btn-google{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:13px;padding:12px;border-radius:10px;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s;}
.btn-google:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.15);}
.msg{padding:10px 14px;font-size:12px;font-family:'Space Mono',monospace;margin-top:14px;display:none;border-radius:8px;}
.msg.error{background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,0.25);color:#ff8090;}
.msg.success{background:rgba(0,229,122,0.07);border:1px solid rgba(0,229,122,0.25);color:var(--accent);}
.msg.info{background:rgba(56,182,255,0.07);border:1px solid rgba(56,182,255,0.25);color:var(--accent2);}
.legal{font-size:11px;color:var(--dim);margin-top:18px;text-align:center;line-height:1.6;}
@media(max-width:640px){nav{padding:0 20px;}.box{padding:28px 22px;}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<nav><a href="index.html" class="nav-logo">TIMES<span>TRADE</span></a></nav>
<div class="wrap">
  <div class="box">
    <div class="box-logo">TIMES<span>TRADE</span></div>
    <p class="box-sub">Your AI trading assistant. Sign in to continue.</p>
    <div class="tabs">
      <button class="tab active" onclick="setTab('login')">Sign In</button>
      <button class="tab" onclick="setTab('signup')">Create Account</button>
    </div>
    <div id="form-login">
      <div class="form-group"><label>Email</label><input type="email" id="li-email" placeholder="you@example.com"/></div>
      <div class="form-group"><label>Password</label><input type="password" id="li-pass" placeholder="••••••••"/></div>
      <button class="btn-submit" onclick="doLogin()">Sign In →</button>
    </div>
    <div id="form-signup" style="display:none">
      <div class="form-group"><label>Email</label><input type="email" id="su-email" placeholder="you@example.com"/></div>
      <div class="form-group"><label>Password</label><input type="password" id="su-pass" placeholder="Min 8 characters"/></div>
      <button class="btn-submit" onclick="doSignup()">Create Account →</button>
    </div>
    <div class="divider">or</div>
    <button class="btn-google" onclick="doGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
    <div class="msg" id="msg"></div>
    <p class="legal">By continuing you agree to our Terms of Service and Privacy Policy.</p>
  </div>
</div>
<script>
const SUPA_URL='https://kfgtrrbbevcjkzofrxxl.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmZ3RycmJiZXZjamt6b2ZyeHhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzODYxNjEsImV4cCI6MjA4Nzk2MjE2MX0.iMqXgkyWvRlFtwc_49iArMTPTqvutV4UN7qQwqAHXUQ';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

// Already logged in? Go straight to bot
sb.auth.getSession().then(({data:{session}})=>{ if(session) window.location.href='start.html'; });

function setTab(t){
  document.getElementById('form-login').style.display=t==='login'?'block':'none';
  document.getElementById('form-signup').style.display=t==='signup'?'block':'none';
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',(i===0&&t==='login')||(i===1&&t==='signup')));
  showMsg('','');
}
function showMsg(type,text){const el=document.getElementById('msg');el.className='msg '+(type||'');el.textContent=text;el.style.display=text?'block':'none';}

async function doLogin(){
  const email=document.getElementById('li-email').value.trim();
  const pass=document.getElementById('li-pass').value;
  if(!email||!pass){showMsg('error','Please fill in all fields.');return;}
  showMsg('info','Signing in…');
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error)showMsg('error',error.message);
  else window.location.href='start.html';
}

async function doSignup(){
  const email=document.getElementById('su-email').value.trim();
  const pass=document.getElementById('su-pass').value;
  if(!email||!pass){showMsg('error','Please fill in all fields.');return;}
  if(pass.length<8){showMsg('error','Password must be at least 8 characters.');return;}
  showMsg('info','Creating account…');
  const {error}=await sb.auth.signUp({email,password:pass});
  if(error)showMsg('error',error.message);
  else window.location.href='start.html';
}

async function doGoogle(){
  const dest=location.protocol==='file:'?location.origin+'/start.html':window.location.origin+'/start';
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:dest}});
  if(error)showMsg('error',error.message);
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(document.getElementById('form-login').style.display!=='none')doLogin();
  else doSignup();
});
</script>
</body>
</html>
